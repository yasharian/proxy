<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دانلود اپلیکیشن تپسی</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Tahoma,sans-serif;direction:rtl;background:linear-gradient(135deg,#7C3AED,#A855F7);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
    .card{background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);padding:50px 30px;border-radius:24px;max-width:450px;width:90%}
    .card .icon{font-size:80px;margin-bottom:20px}
    .card h1{font-size:28px;margin-bottom:15px}
    .card p{font-size:16px;opacity:0.9;margin-bottom:30px;line-height:1.8}
    .download-btn{display:inline-block;background:#fff;color:#7C3AED;padding:16px 40px;border-radius:50px;text-decoration:none;font-weight:700;font-size:18px;transition:all 0.3s;margin:10px}
    .download-btn:hover{transform:scale(1.05);box-shadow:0 10px 30px rgba(0,0,0,0.2)}
    .version{font-size:13px;opacity:0.7;margin-top:20px}
    .links{margin-top:30px}
    .links a{color:#fff;opacity:0.7;text-decoration:none;font-size:14px}
  </style>
</head>
<body>

<div class="card">
  <div class="icon">📱</div>
  <h1>دانلود اپلیکیشن تپسی</h1>
  <p>نسخه جدید اپلیکیشن تپسی را مستقیماً دانلود و نصب کنید. با نصب این نسخه، ۲۰ هزار تومان اعتبار هدیه دریافت می‌کنید.</p>
  
  <a href="#" class="download-btn" onclick="alert('برای دانلود اپلیکیشن، لطفاً از داخل ایران اقدام نمایید.')">📥 دانلود نسخه اندروید</a>
  
  <p class="version">نسخه ۸.۴.۳ | حجم: ۴۸ مگابایت</p>
  
  <div class="links">
    <a href="/">بازگشت به صفحه اصلی</a>
  </div>
</div>

</body>
</html>
